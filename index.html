<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>教师课表查询</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  background: #F2F0EC;
  color: #1a1a2e;
  min-height: 100vh;
}
.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: #F2F0EC;
  position: relative;
  overflow: hidden;
}

/* ===== 顶部导航 ===== */
.nav-bar {
  background: #2B3C64;
  color: #fff;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.nav-bar .back-btn {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 20px;
  border-radius: 50%;
  transition: background .2s;
}
.nav-bar .back-btn:active { background: rgba(255,255,255,.15); }
.nav-bar .nav-title {
  font-size: 17px;
  font-weight: 600;
  flex: 1;
  text-align: center;
  margin-right: 36px;
}
.nav-bar.detail .nav-title { margin-right: 0; }
.nav-bar .return-pill {
  background: rgba(255,255,255,.18);
  border-radius: 20px;
  padding: 6px 16px;
  font-size: 14px;
  cursor: pointer;
  display: flex; align-items: center; gap: 4px;
  transition: background .2s;
}
.nav-bar .return-pill:active { background: rgba(255,255,255,.3); }

/* ===== 首页 ===== */
.hero {
  background: #2B3C64;
  padding: 0 20px 28px;
  color: #fff;
}
.hero .hero-icon {
  width: 44px; height: 44px;
  background: rgba(255,255,255,.15);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 10px;
  font-size: 22px;
}
.hero h1 {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 4px;
}
.hero .hero-sub {
  font-size: 14px;
  opacity: .7;
}

.year-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #E8EDF5;
  color: #2B3C64;
  padding: 7px 16px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 500;
  margin: 20px 20px 0;
}

.main-title {
  padding: 16px 20px 8px;
}
.main-title h2 {
  font-size: 32px;
  font-weight: 800;
  line-height: 1.3;
  color: #1a1a2e;
}
.main-title .sub {
  font-size: 15px;
  color: #888;
  margin-top: 8px;
}

/* 搜索框 */
.search-box {
  margin: 20px;
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 16px 48px 16px 48px;
  border: none;
  border-radius: 16px;
  font-size: 16px;
  background: #fff;
  box-shadow: 0 2px 12px rgba(0,0,0,.06);
  outline: none;
  transition: box-shadow .2s;
}
.search-box input:focus {
  box-shadow: 0 4px 20px rgba(43,60,100,.15);
}
.search-box .search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: #999;
  font-size: 18px;
}
.search-box .clear-btn {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 24px; height: 24px;
  background: #ddd;
  border-radius: 50%;
  display: none;
  align-items: center; justify-content: center;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
}
.search-box .clear-btn.show { display: flex; }

/* 搜索结果 */
.search-results {
  padding: 0 20px;
  display: none;
}
.search-results.show { display: block; }
.search-result-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: #fff;
  border-radius: 12px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: transform .15s;
}
.search-result-item:active { transform: scale(.98); }
.search-result-item .avatar {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  font-size: 18px;
  font-weight: 600;
  flex-shrink: 0;
}
.search-result-item .info .name {
  font-size: 16px;
  font-weight: 600;
}
.search-result-item .info .hint {
  font-size: 12px;
  color: #999;
}

/* 教师列表 */
.teacher-section {
  padding: 8px 20px 40px;
}
.teacher-section .section-header {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 14px;
}
.teacher-section .section-header .label {
  font-size: 18px;
  font-weight: 700;
  color: #555;
}
.teacher-section .section-header .count {
  font-size: 14px;
  color: #aaa;
}
.teacher-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.teacher-card {
  background: #fff;
  border-radius: 14px;
  padding: 12px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: transform .15s, box-shadow .2s;
  box-shadow: 0 1px 4px rgba(0,0,0,.04);
  overflow: hidden;
}
.teacher-card:active {
  transform: scale(.96);
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
}
.teacher-card .avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  flex-shrink: 0;
}
.teacher-card .name {
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ===== 课表详情页 ===== */
.detail-page {
  display: none;
  padding-bottom: 40px;
}
.detail-page.show { display: block; }

.teacher-header {
  padding: 24px 20px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.teacher-header .avatar {
  width: 64px; height: 64px;
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  font-size: 30px;
  font-weight: 700;
  flex-shrink: 0;
}
.teacher-header .info .name {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 6px;
}
.teacher-header .info .hours-tag {
  display: inline-block;
  background: #FDEEE0;
  color: #E67E22;
  padding: 4px 14px;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 12px;
  padding: 0 20px 20px;
}
.action-btn {
  flex: 1;
  padding: 14px;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  transition: transform .15s, opacity .2s;
  border: none;
}
.action-btn:active { transform: scale(.97); }
.action-btn.primary {
  background: #2B3C64;
  color: #fff;
}
.action-btn.secondary {
  background: #fff;
  color: #2B3C64;
  border: 1.5px solid #2B3C64;
}

/* 课表表格 */
.schedule-wrapper {
  margin: 0 16px;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 2px 16px rgba(0,0,0,.08);
  background: #fff;
}
.schedule-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.schedule-table {
  width: 100%;
  min-width: 560px;
  border-collapse: collapse;
  table-layout: fixed;
}
.schedule-table th {
  background: #2B3C64;
  color: #fff;
  padding: 14px 8px;
  font-size: 15px;
  font-weight: 600;
  text-align: center;
  position: sticky;
  top: 0;
}
.schedule-table th:first-child {
  position: sticky;
  left: 0;
  z-index: 2;
  min-width: 70px;
  background: #2B3C64;
}
.schedule-table td {
  padding: 12px 6px;
  text-align: center;
  font-size: 14px;
  border: 1px solid #E5E7EB;
  vertical-align: middle;
  line-height: 1.4;
  min-height: 56px;
}
.schedule-table td:first-child {
  position: sticky;
  left: 0;
  background: #EEF1F6;
  font-weight: 600;
  color: #2B3C64;
  z-index: 1;
  min-width: 70px;
}
.schedule-table td.has-class {
  background: #fff;
  color: #1a1a2e;
  font-weight: 500;
}
.schedule-table tr:nth-child(even) td:first-child {
  background: #E8ECF3;
}
.stat-row td {
  background: #FDF6EE !important;
  color: #E67E22 !important;
  font-weight: 700;
  font-size: 15px;
  padding: 14px 8px;
}
.stat-row td:first-child {
  background: #FDF6EE !important;
  color: #E67E22 !important;
}

.footer {
  text-align: center;
  padding: 28px 20px 20px;
  font-size: 13px;
  color: #bbb;
}

/* Toast */
.toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,.75);
  color: #fff;
  padding: 12px 24px;
  border-radius: 10px;
  font-size: 14px;
  z-index: 9999;
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* 图片预览遮罩 */
.img-preview-mask {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.85);
  z-index: 10000;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.img-preview-mask.show { display: flex; }
.img-preview-mask .preview-tip {
  color: #fff;
  font-size: 15px;
  margin-bottom: 16px;
  text-align: center;
  line-height: 1.6;
}
.img-preview-mask .preview-tip strong {
  color: #FFD700;
  font-size: 17px;
}
.img-preview-mask img {
  max-width: 100%;
  max-height: 70vh;
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,.5);
}
.img-preview-mask .close-preview {
  margin-top: 20px;
  background: rgba(255,255,255,.2);
  color: #fff;
  border: 1px solid rgba(255,255,255,.4);
  padding: 10px 32px;
  border-radius: 24px;
  font-size: 15px;
  cursor: pointer;
}

/* 截图时移除sticky，避免html2canvas渲染错乱 */
.schedule-table.capturing th,
.schedule-table.capturing th:first-child,
.schedule-table.capturing td:first-child {
  position: static !important;
}

/* 滚动条隐藏 */
.schedule-scroll::-webkit-scrollbar { height: 4px; }
.schedule-scroll::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }
</style>
</head>
<body>
<div class="app">
  <!-- 首页 -->
  <div id="homePage">
    <div class="hero">
      <div class="hero-icon">&#128197;</div>
      <h1>教师课表查询</h1>
      <div class="hero-sub">输入姓名查询个人课表</div>
    </div>
    <div class="year-tag">&#128100; 2026—2027学年</div>
    <div class="main-title">
      <h2>输入姓名，<br>查询你的课表</h2>
      <div class="sub">输入或选择教师姓名，即可查看并保存个人课表</div>
    </div>
    <div class="search-box">
      <span class="search-icon">&#128269;</span>
      <input type="text" id="searchInput" placeholder="请输入教师姓名" autocomplete="off">
      <span class="clear-btn" id="clearBtn" onclick="clearSearch()">&#10005;</span>
    </div>
    <div class="search-results" id="searchResults"></div>
    <div class="teacher-section" id="teacherSection">
      <div class="section-header">
        <span class="label">全部教师</span>
        <span class="count">共 <span id="teacherCount">0</span> 位教师</span>
      </div>
      <div class="teacher-grid" id="teacherGrid"></div>
    </div>
  </div>

  <!-- 详情页 -->
  <div id="detailPage" class="detail-page">
    <div class="nav-bar detail">
      <div class="back-btn" onclick="goHome()">&#8249;</div>
      <div class="nav-title" id="detailNavTitle">课表</div>
      <div class="return-pill" onclick="goHome()">&#8249; 返回</div>
    </div>
    <div id="detailContent"></div>
    <div class="footer">教师课表查询 · 2026—2027学年</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="img-preview-mask" id="imgPreviewMask" onclick="if(event.target===this)closePreview()">
  <div class="preview-tip">
    <strong>长按下方图片</strong>，选择"保存到手机"<br>
    即可将课表保存到相册
  </div>
  <img id="previewImg" src="" alt="课表">
  <button class="close-preview" onclick="closePreview()">关闭</button>
</div>

// 头像颜色池
const AVATAR_COLORS = [
  '#4A7C59', '#A0522D', '#5B7DB1', '#8B7355', '#7B68AE',
  '#C06C42', '#3D8B7E', '#9B59B6', '#2E86AB', '#B8860B',
  '#6B8E23', '#CD853F', '#4682B4', '#8FBC8F', '#D2691E',
  '#5F9EA0', '#A0522D', '#6A5ACD', '#228B22', '#B22222'
];

function getAvatarColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) {
    hash = name.charCodeAt(i) + ((hash << 5) - hash);
  }
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// 渲染教师列表
function renderTeacherList(list) {
  const grid = document.getElementById('teacherGrid');
  grid.innerHTML = list.map(t => `
    <div class="teacher-card" onclick="showDetail('${t.name}')">
      <div class="avatar" style="background:${getAvatarColor(t.name)}">${t.name[0]}</div>
      <div class="name">${t.name}</div>
    </div>
  `).join('');
  document.getElementById('teacherCount').textContent = list.length;
}

// 搜索
document.getElementById('searchInput').addEventListener('input', function(e) {
  const q = e.target.value.trim();
  const clearBtn = document.getElementById('clearBtn');
  const resultsDiv = document.getElementById('searchResults');
  const section = document.getElementById('teacherSection');

  if (q) {
    clearBtn.classList.add('show');
    const matched = TEACHERS.filter(t => t.name.includes(q));
    if (matched.length > 0) {
      resultsDiv.innerHTML = matched.map(t => `
        <div class="search-result-item" onclick="showDetail('${t.name}')">
          <div class="avatar" style="background:${getAvatarColor(t.name)}">${t.name[0]}</div>
          <div class="info">
            <div class="name">${t.name}</div>
            <div class="hint">查看课表 · 周课时 ${t.weeklyHours}</div>
          </div>
        </div>
      `).join('');
      resultsDiv.classList.add('show');
      section.style.display = 'none';
    } else {
      resultsDiv.innerHTML = '<div style="text-align:center;padding:20px;color:#999;font-size:14px;">未找到该教师</div>';
      resultsDiv.classList.add('show');
      section.style.display = 'none';
    }
  } else {
    clearBtn.classList.remove('show');
    resultsDiv.classList.remove('show');
    section.style.display = 'block';
  }
});

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').classList.remove('show');
  document.getElementById('searchResults').classList.remove('show');
  document.getElementById('teacherSection').style.display = 'block';
}

  if (!teacher) return;

    let cells = `<td>${periods[i]}</td>`;

    <div class="action-buttons">
      <button class="action-btn primary" onclick="saveImage()">&#11015; 保存图片</button>
      <button class="action-btn secondary" onclick="savePDF()">&#128196; 保存PDF</button>
    </div>
    <div class="schedule-wrapper">
      <div class="schedule-scroll">
        <table class="schedule-table" id="scheduleTable">
          <thead>
            <tr>
              <th>节次</th>
              ${days.map(d => `<th>${d}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${tableRows}
            <tr class="stat-row">
              <td>课时统计</td>
              <td colspan="5" style="text-align:right;padding-right:20px;">周课时：${teacher.weeklyHours}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  `;

  window.scrollTo(0, 0);
}

function goHome() {
  document.getElementById('detailPage').classList.remove('show');
  document.getElementById('homePage').style.display = 'block';
  clearSearch();
  window.scrollTo(0, 0);
}

// 保存图片
function captureSchedule(callback) {
  const target = document.getElementById('scheduleTable');
  const scroll = target.closest('.schedule-scroll');
  // 滚动到最左，确保从第一列开始截取
  if (scroll) scroll.scrollLeft = 0;
  // 临时移除sticky，避免html2canvas渲染错乱
  target.classList.add('capturing');
  // 等待一帧让样式生效
  requestAnimationFrame(() => {
    html2canvas(target, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#ffffff',
      logging: false
    }).then(canvas => {
      target.classList.remove('capturing');
      callback(canvas.toDataURL('image/png'));
    }).catch(() => {
      target.classList.remove('capturing');
      showToast('生成失败，请截图保存');
    });
  });
}

function saveImage() {
  showToast('正在生成图片...');
  captureSchedule(dataUrl => {
    document.getElementById('previewImg').src = dataUrl;
    document.getElementById('imgPreviewMask').classList.add('show');
  });
}

function closePreview() {
  document.getElementById('imgPreviewMask').classList.remove('show');
}

// 保存PDF：QQ/微信内不支持直接打印，生成图片提示用户保存
function savePDF() {
  showToast('正在生成图片...');
  captureSchedule(dataUrl => {
    document.getElementById('previewImg').src = dataUrl;
    document.querySelector('.img-preview-mask .preview-tip').innerHTML =
      '<strong>长按下方图片</strong>保存到手机<br>保存后可在手机中转为PDF或打印';
    document.getElementById('imgPreviewMask').classList.add('show');
  });
}

// 初始化
renderTeacherList(TEACHERS);
</script>
</body>
</html>
